[package]
name = "redteam"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# The adversary tool for the Byzantine test harness. It links the REAL federation
# crate, so every "forged" artifact it produces is cryptographically well-formed —
# the honest cluster is attacked with genuine Ed25519 signatures and genuine
# control-plane writes, exactly as a majority-compromised operator could. It is a
# test-only binary (publish = false) and is not part of any deploy image except the
# harness image (deploy/byzantine/Dockerfile).

[[bin]]
name = "redteam"
path = "src/main.rs"

[dependencies]
domain = { workspace = true }
federation = { workspace = true }
adapter-control-etcd = { workspace = true }
adapter-federation = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
axum = { workspace = true }
anyhow = { workspace = true }

# Not in [workspace.dependencies]; mirror adapter-federation's reqwest (json + rustls).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
