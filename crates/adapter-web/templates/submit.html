{% extends "base.html" %}
{% block title %}{{ t.new_post_heading }} · Democratos{% endblock %}
{% block head %}
<style id="composer-styles">
  /* Constrain the composer via its own wrapper (not a bare `main` rule) so the
     same styles can be lifted into the in-page dialog without shrinking the
     host page's `main`. */
  .composer { max-width: 640px; margin: 0 auto; }
  .submit-form { display: flex; flex-direction: column; gap: .9rem; margin-top: .5rem; }
  .submit-form input, .submit-form textarea, .submit-form select { width: 100%; }
  .submit-form textarea { font: inherit; padding: .5rem; border-radius: 6px;
                          border: 1px solid var(--line); resize: vertical; min-height: 6rem; }
  .submit-form input[type=text], .submit-form select {
    border: 1px solid var(--line); border-radius: 6px; padding: .45rem .5rem; }
  /* A small positive gap below the label — a negative margin here pulled the
     select up under the label text and the two overlapped. */
  .field-label { font-size: .85rem; color: var(--muted); margin: 0 0 .35rem; }
  /* Media dropzone + the list of attached items. */
  .dropzone { position: relative; display: block; border: 2px dashed var(--line);
              border-radius: 14px; padding: 1.3rem 1.1rem; text-align: center; color: var(--muted);
              cursor: pointer; overflow: hidden;
              transition: transform .18s ease, border-color .18s ease,
                          background-color .18s ease, box-shadow .18s ease, color .18s ease; }
  .dropzone .drop-icon { display: block; width: 32px; height: 32px; margin: 0 auto .45rem;
              transition: transform .2s ease; }
  .dropzone .drop-url-hint { display: block; font-size: .78rem; margin-top: .35rem; opacity: .8; }
  .dropzone .drop-active { display: none; font-weight: 600; }
  .dropzone input[type=file] { display: block; margin: .55rem auto 0; }
  /* A drag started anywhere on the page: gently invite a drop here. */
  .dropzone.inviting { border-color: var(--accent); background: var(--accent-soft); color: var(--accent);
              animation: dz-glow 1.5s ease-in-out infinite; }
  .dropzone.inviting .drop-icon { animation: dz-bob 1.1s ease-in-out infinite; }
  /* Dragging directly over the zone: primed, ready to drop. */
  .dropzone.drag { border-color: var(--accent); border-style: solid; background: var(--accent-soft);
              color: var(--accent); transform: scale(1.03);
              box-shadow: 0 0 0 4px var(--accent-soft), 0 10px 28px rgba(0,0,0,.14); animation: none; }
  .dropzone.drag .drop-icon { transform: translateY(-5px) scale(1.18); animation: none; }
  .dropzone.drag .drop-idle { display: none; }
  .dropzone.drag .drop-active { display: inline; }
  /* Brief shake + red flash when a dragged link isn't a supported media URL. */
  .dropzone.reject { border-color: #d33; background: rgba(221,51,51,.08); color: #d33;
              animation: dz-shake .4s ease; }
  @keyframes dz-glow {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft); }
    50%      { box-shadow: 0 0 0 7px transparent; } }
  @keyframes dz-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); } }
  @keyframes dz-shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) {
    .dropzone, .dropzone .drop-icon { transition: none; }
    .dropzone.inviting, .dropzone.inviting .drop-icon, .dropzone.reject { animation: none; } }
  .media-list { display: flex; flex-direction: column; gap: .6rem; }
  .media-item { display: flex; gap: .6rem; align-items: flex-start; border: 1px solid var(--line);
                border-radius: 10px; padding: .5rem; }
  .media-item .preview img, .media-item .preview video { width: 84px; height: 84px;
                object-fit: cover; border-radius: 8px; display: block; background: var(--line); }
  .media-item .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .35rem; }
  .media-item .name { font-size: .8rem; color: var(--muted); overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .media-item button.remove { align-self: flex-start; }
</style>
{% endblock %}
{% block content %}
<div class="composer">
<h1>{{ t.new_post_heading }}</h1>

<form method="post" action="/posts" class="submit-form" enctype="multipart/form-data"
      data-caption-placeholder="{{ t.caption_placeholder }}" data-bad-url="{{ t.drop_bad_url }}">
  <div>
    <p class="field-label">{{ t.community_label }}</p>
    <select name="demos" required aria-label="{{ t.community_label }}">
      {% for c in communities %}
      <option value="{{ c.slug }}"{% if c.selected %} selected{% endif %}>d/{{ c.slug }} — {{ c.name }}</option>
      {% endfor %}
    </select>
  </div>

  <input type="text" name="title" placeholder="{{ t.post_title_placeholder }}" required autofocus>

  <textarea name="body" rows="5" placeholder="{{ t.post_body_placeholder }}"></textarea>

  <!-- Media: without JS, a single multi-file input; JS turns each chosen file
       into a removable row with its own caption. -->
  <div class="media-field">
    <p class="field-label">{{ t.upload_heading }}</p>
    <label class="dropzone">
      <svg class="drop-icon" width="32" height="32" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true">
        <path d="M12 15V4"/>
        <path d="M8 8l4-4 4 4"/>
        <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
      </svg>
      <span class="drop-text">
        <span class="drop-idle">{{ t.drop_hint }} <strong>{{ t.choose_file }}</strong></span>
        <span class="drop-active">{{ t.drop_now }}</span>
      </span>
      <span class="drop-url-hint">{{ t.drop_url_hint }}</span>
      <input type="file" name="file" multiple
             accept="image/png,image/jpeg,image/gif,image/webp,video/mp4,video/webm">
    </label>
    <div class="media-list"></div>
  </div>

  <input type="text" name="tags" placeholder="{{ t.tags_placeholder }}">

  <div><button>{{ t.submit_post }}</button></div>
</form>
</div>

<script src="/static/composer.js" defer></script>
{% endblock %}
