[package]
name = "adapter-web"
edition.workspace = true
version.workspace = true
license.workspace = true

# A driving adapter: server-rendered, progressively-enhanced HTML over Axum.
# Every page works with plain forms and no JavaScript; a small JS layer enhances
# voting in place. Exposes `router(services)`; the composition root serves it.
[dependencies]
domain = { workspace = true }
app = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true }
askama = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ipnet = { workspace = true }
