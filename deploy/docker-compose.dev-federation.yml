# Democratos — multi-node federation with a PRIVATE dev node for seeding content.
#
# Same community-sharded cluster as docker-compose.federation.yml, but with one
# extra node whose sole job is to let YOU post fake content by switching between
# a fixed set of "puppet" accounts — while nobody else can.
#
#   ┌── public :8080 ──┐          ┌── 127.0.0.1:8090 (loopback only) ──┐
#   │      caddy       │          │            caddy-dev                │
#   └──┬──────────┬────┘          └──────────────┬─────────────────────┘
#      ▼          ▼                               ▼
#    node1  ⇄ federation ⇄  node2   ⇄ federation ⇄  node-dev   (--dev)
#     dev OFF            dev OFF                    dev ON + unlock secret
#      │                   │                          │
#     db1                 db2                       db-dev
#        \                 |                         /
#         ├── etcd ────────┼──────── minio ─────────┤
#
# WHY THIS SHAPE (the "only I can switch accounts" requirement):
#   * node1/node2 have the dev switcher OFF — the public :8080 site cannot switch
#     accounts at all; every /dev/* endpoint 404s there.
#   * node-dev has --dev ON but is NOT on the public `edge` network, so the public
#     proxy can never reach it. It is fronted only by caddy-dev, which the compose
#     binds to 127.0.0.1:8090 — reachable from your machine, nobody else's.
#   * Unlocking the switcher additionally requires DEMOCRATOS_DEV_UNLOCK_SECRET as
#     `/dev/unlock?key=…`. The app also REFUSES to boot a --dev node on a non-
#     loopback bind without that secret, so this stays fail-closed by construction.
#   * The switcher only ever acts as the DEMOCRATOS_DEV_ACCOUNTS puppets, which are
#     created franchise-BARRED: they can post content but can never become voters.
#
#   docker compose -f deploy/docker-compose.dev-federation.yml up -d --build
#   # public site (read):        http://localhost:8080
#   # your private switcher:      http://localhost:8090/dev/unlock?key=$DEMOCRATOS_DEV_UNLOCK_SECRET
#
# All secrets come from a git-ignored deploy/.env (see deploy/.env.example); the
# compose refuses to start if any is unset.

x-node-common: &node-common
  build:
    context: ..
    dockerfile: Dockerfile
  image: democratos:latest
  restart: unless-stopped
  environment: &node-env
    DEMOCRATOS_STORE: postgres
    DEMOCRATOS_MEDIA: s3
    DEMOCRATOS_S3_ENDPOINT: http://minio:9000
    DEMOCRATOS_S3_BUCKET: democratos-media
    DEMOCRATOS_S3_PATH_STYLE: "true"
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/.env}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/.env}
    DEMOCRATOS_ADDR: 0.0.0.0:3000
    DEMOCRATOS_FEDERATION_ADDR: 0.0.0.0:7400
    DEMOCRATOS_ETCD_ENDPOINTS: http://etcd:2379
    DEMOCRATOS_CLUSTER_TOKEN: ${DEMOCRATOS_CLUSTER_TOKEN:?set DEMOCRATOS_CLUSTER_TOKEN in deploy/.env}
    DEMOCRATOS_ALLOW_PLAINTEXT_FEDERATION: "1"
    DEMOCRATOS_RECOMMEND_INDEX: /tmp/democratos.recindex
    DEMOCRATOS_REFRESH_SECS: "120"
  tmpfs:
    - /tmp:size=64m

services:
  # --- control plane ---------------------------------------------------------
  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.16
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd-data:/etcd-data
    networks: [fabric]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- shared media object store --------------------------------------------
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/.env}
    volumes:
      # Media lives here. Leave MEDIA_DIR unset to use the `minio-data` Docker
      # volume; on a box with a big disk (e.g. the Raspberry Pi's multi-TB drive)
      # set MEDIA_DIR=/mnt/your-drive/democratos-media in deploy/.env to bind the
      # store straight onto it. An absolute path is a bind mount; the bare default
      # name is the managed volume declared below.
      - ${MEDIA_DIR:-minio-data}:/data
    networks: [fabric]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- per-node source-of-truth databases ------------------------------------
  db1:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      POSTGRES_DB: democratos
    volumes:
      - db1-data:/var/lib/postgresql/data
    networks: [fabric]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d democratos"]
      interval: 10s
      timeout: 3s
      retries: 5

  db2:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      POSTGRES_DB: democratos
    volumes:
      - db2-data:/var/lib/postgresql/data
    networks: [fabric]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d democratos"]
      interval: 10s
      timeout: 3s
      retries: 5

  db-dev:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      POSTGRES_DB: democratos
    volumes:
      - dbdev-data:/var/lib/postgresql/data
    networks: [fabric]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d democratos"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- public app nodes (dev switcher OFF) -----------------------------------
  node1:
    <<: *node-common
    environment:
      <<: *node-env
      DEMOCRATOS_NODE_ID: "1"
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db1:5432/democratos
      DEMOCRATOS_NODE_SEED: ${NODE1_SEED:?set NODE1_SEED in deploy/.env}
    command: ["serve", "--peer", "2=http://node2:7400", "--peer", "9=http://node-dev:7400"]
    depends_on:
      db1: {condition: service_healthy}
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [fabric, edge]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

  node2:
    <<: *node-common
    environment:
      <<: *node-env
      DEMOCRATOS_NODE_ID: "2"
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db2:5432/democratos
      DEMOCRATOS_NODE_SEED: ${NODE2_SEED:?set NODE2_SEED in deploy/.env}
    command: ["serve", "--peer", "1=http://node1:7400", "--peer", "9=http://node-dev:7400"]
    depends_on:
      db2: {condition: service_healthy}
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [fabric, edge]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

  # --- PRIVATE dev node (dev switcher ON, loopback-only, secret-gated) --------
  # Not on `edge`: the public proxy can never reach it. Reachable only via
  # caddy-dev on 127.0.0.1:8090. --dev on a non-loopback bind REQUIRES the unlock
  # secret, so it fails closed if you forget to set it.
  node-dev:
    <<: *node-common
    environment:
      <<: *node-env
      DEMOCRATOS_NODE_ID: "9"
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db-dev:5432/democratos
      DEMOCRATOS_NODE_SEED: ${NODE_DEV_SEED:?set NODE_DEV_SEED in deploy/.env}
      # The account switcher, gated by a secret only you hold, acting only as the
      # franchise-barred puppet accounts below.
      DEMOCRATOS_DEV: "1"
      DEMOCRATOS_DEV_UNLOCK_SECRET: ${DEMOCRATOS_DEV_UNLOCK_SECRET:?set DEMOCRATOS_DEV_UNLOCK_SECRET in deploy/.env}
      DEMOCRATOS_DEV_ACCOUNTS: ${DEMOCRATOS_DEV_ACCOUNTS:?set DEMOCRATOS_DEV_ACCOUNTS in deploy/.env}
    command: ["serve", "--peer", "1=http://node1:7400", "--peer", "2=http://node2:7400"]
    depends_on:
      db-dev: {condition: service_healthy}
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [fabric, edge_dev]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

  # --- public reverse proxy (never routes to node-dev) -----------------------
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [edge]
    depends_on: [node1, node2]

  # --- PRIVATE reverse proxy for the dev node (loopback only) ----------------
  caddy-dev:
    image: caddy:2
    restart: unless-stopped
    ports:
      # Bound to loopback: only your machine can reach the switcher.
      - "127.0.0.1:8090:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    networks: [edge_dev]
    depends_on: [node-dev]

networks:
  # `fabric` carries DB traffic, the federation feed/command RPC, etcd, and media
  # — never published.
  fabric:
    internal: false
  # `edge` connects only the public proxy to the public app nodes.
  edge: {}
  # `edge_dev` connects only the private proxy to the dev node — isolated from
  # both the public proxy and the public app nodes.
  edge_dev: {}

volumes:
  etcd-data:
  minio-data:
  db1-data:
  db2-data:
  dbdev-data:
